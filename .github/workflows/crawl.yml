name: daily-crawl

on:
  schedule:
    - cron: "30 18 * * *" # 03:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crawl daycare data
        run: npx tsx scripts/crawl.ts
        env:
          CHILDCARE_API_KEY: ${{ secrets.CHILDCARE_API_KEY }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: daily crawl $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
